packages:
  - packages/*
  - examples/*

autoInstallPeers: false
strictPeerDependencies: true

# Dependency lifecycle scripts are denied by default (pnpm >= 10 behaviour).
# Adding an entry here is a reviewed supply-chain decision, not a convenience.
# See .agents/skills/pnpm-supply-chain/SKILL.md.
onlyBuiltDependencies: []

# Single source of truth for every third-party version in the workspace.
# Packages reference `catalog:` so a version can never drift per package.
catalog:
  # --- runtime dependencies (shipped) -------------------------------------
  zod: 4.5.4

  # Optional peer of @relvo-labs/agent-provider-claude, never a dependency of
  # this workspace: the package is published under Anthropic's proprietary
  # terms and carries a ~200 MB per-platform native payload, so the adapter
  # resolves it at runtime from the host's own installation instead.
  # 0.3.259 is the newest release older than the 3-day cooldown window.
  '@anthropic-ai/claude-agent-sdk': 0.3.259

  # --- toolchain (dev only) ------------------------------------------------
  # The npm CLI this repository publishes with, and the one the release
  # tooling's differential test compares its tar reader against. Pinned here
  # rather than inherited from the runtime because `pnpm/setup` installs Node
  # from the `node` package, whose payload is the `node` binary alone — there
  # is no bundled npm anywhere under `$PNPM_HOME`. Leaving it implicit meant
  # the test read one npm (whatever the developer's Node shipped) while
  # publication spawned another (whatever was on `PATH`), and in CI neither
  # existed. One pin makes those the same proven package.
  #
  # 11.19.1, not the newer 12.x line: npm 12 declares
  # `engines.node: ^22.22.2 || ^24.15.0 || >=26.0.0`, which excludes the
  # 22.18.0 lower bound of our supported matrix. 11.19.1 declares
  # `^20.17.0 || >=22.9.0` and covers 22.18.0, 24.20.0 and 26.8.1. It is the
  # newest version that does, and it is older than the 3-day cooldown
  # (published 2026-08-26). It adds exactly one entry to the lockfile: npm
  # vendors all 65 of its dependencies as bundleDependencies.
  npm: 11.19.1

  # TypeScript is pinned to the 6.x line on purpose. typescript@7 is the
  # native port and ships no JavaScript compiler API, which type-aware
  # linting depends on. See docs/adr/ADR-0012-typescript-toolchain-line.md.
  typescript: 6.0.3
  # Typed against the LOWEST supported Node line (22.18) so a package can
  # never compile against an API that is missing on the oldest matrix entry.
  '@types/node': 22.20.1

  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  ajv: 8.17.1
  ajv-formats: 3.0.1

  eslint: 10.9.1
  '@eslint/js': 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  prettier: 3.9.6

  tsdown: 0.22.14
  publint: 0.3.24
  '@arethetypeswrong/cli': 0.18.5
  '@changesets/cli': 3.0.1
  # Direct library imports match the already locked CLI dependency graph.
  '@changesets/assemble-release-plan': 7.0.0
  '@changesets/config': 4.0.0
  '@changesets/pre': 3.0.0
  '@changesets/read': 1.0.0
  '@manypkg/get-packages': 3.1.0

  # Dev-only, examples/reference-app only: drives a system-supplied Chromium
  # for its optional browser check (`scripts/browser-check.ts`). `playwright-core`
  # (not `playwright`) ships no postinstall browser download — it drives a
  # browser supplied via `executablePath`/environment override, never one
  # this workspace's install fetches. Verified against the live registry:
  # 1.63.0 published 2026-09-04 (> the 3-day cooldown as of this pin).
  playwright-core: 1.63.0

# Supply-chain cooldown: a freshly published version is the highest-risk window
# for a compromised release. Refuse anything younger than 3 days unless it is
# explicitly excluded below after review.
minimumReleaseAge: 4320 # minutes (3 days)
minimumReleaseAgeStrict: true
