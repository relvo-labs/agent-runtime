name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24.20.0, 26.8.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Materialize Changesets base ref
        run: git update-ref refs/heads/main refs/remotes/origin/main
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.25.0
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true
          install: false
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run canonical gate
        run: pnpm gate
